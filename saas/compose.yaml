name: contas-saas-dev
services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: contas
      POSTGRES_DB: contas_saas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contas -d contas_saas"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    environment:
      DATABASE_URL: postgres://contas:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}@db:5432/contas_saas
      APP_BIND: 0.0.0.0:8080
      WEB_DIR: /app/web
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
