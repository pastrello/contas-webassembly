[workspace]
members = ["crates/api", "crates/web", "crates/contracts"]
default-members = ["crates/api", "crates/contracts"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2021"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
contas-contracts = { path = "crates/contracts" }
