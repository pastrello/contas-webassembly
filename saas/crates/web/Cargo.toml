[package]
name = "contas-web"
version.workspace = true
edition.workspace = true
publish.workspace = true
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
wasm-bindgen = "=0.2.105"
wasm-bindgen-futures = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Response", "Request", "RequestInit", "RequestCredentials", "Headers", "Event", "EventTarget", "HtmlInputElement", "HtmlFormElement", "NodeList"] }
